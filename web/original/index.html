<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jhshrvdp - the original IOCCC 2025 entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background: #111; color: #ccc; font-family: system-ui, sans-serif;
       display: flex; flex-direction: column; align-items: center; margin: 0; padding: 16px; }
h1 { font-size: 18px; font-weight: 600; }
#term { font: 16px/1.12 "Menlo", "Consolas", monospace; background: #0a0a0a;
        padding: 12px; border-radius: 8px; white-space: pre; margin: 8px 0; }
#status { min-height: 1.4em; color: #eb6; font: 15px monospace; }
nav { margin-top: 10px; font-size: 13px; }
nav a { color: #8ac; text-decoration: none; margin: 0 10px; }
nav a:hover { text-decoration: underline; }
#savebar { margin: 6px 0; }
#savebar input { background: #0a0a0a; color: #ccc; border: 1px solid #444;
                 border-radius: 6px; padding: 5px 8px; font: 13px monospace; width: 300px; }
#savebar button { background: #222; color: #ccc; border: 1px solid #444;
                  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
#savebar button:hover { border-color: #8ac; }
p.keys { font-size: 13px; color: #888; }
</style>
</head>
<body>
<h1>jhshrvdp - the original IOCCC 2025 entry, untouched</h1>
<p class="keys">WASD moves, T teleports (3 score), Q quits. Every keypress is one turn.</p>
<pre id="term"></pre>
<div id="status"></div>
<div id="savebar">
<input id="saveinp" placeholder=":seed:floor:hp:y:x:money:" spellcheck="false">
<button id="copybtn">Copy</button>
<button id="loadbtn">Load</button>
</div>
<nav>
<a href="../">all versions</a>
<a href="https://github.com/adipascu/carrot-crawler-3d" rel="noopener">source</a>
<a href="https://www.ioccc.org/2025/jhshrvdp/index.html" rel="noopener">IOCCC entry page</a>
</nav>
<script>
var params = new URLSearchParams(location.search);
var Module = {
	arguments: (function() {
		var t = params.get("save") || sessionStorage.getItem("save");
		return t ? [t] : [];
	})(),
	print: function(line) {
		if (line && line.charCodeAt(0) !== 27)
			document.getElementById("status").textContent =
				line + "  (reload the page to play again)";
	}
};
</script>
<script>
var saveField = document.getElementById("saveinp");
var tracking = true;
saveField.addEventListener("focus", function() { tracking = false; saveField.select(); });
document.getElementById("term").addEventListener("mousedown", function() {
	tracking = true;
	saveField.blur();
});
addEventListener("keydown", function(e) {
	var el = document.activeElement;
	if (!el || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA")) tracking = true;
});
setInterval(function() {
	if (!tracking) return;
	var m = document.getElementById("term").innerText.match(/:[0-9a-f]+(?::[0-9a-f]{2}){5}:/);
	if (m) saveField.value = m[0];
}, 500);
saveField.addEventListener("paste", function(e) {
	e.preventDefault();
	var t = (e.clipboardData || window.clipboardData).getData("text");
	var m = t.match(/:[0-9a-f]+(?::[0-9a-f]{2}){5}:/);
	saveField.value = m ? m[0] : t.trim();
});
document.getElementById("copybtn").onclick = function() {
	if (saveField.value && navigator.clipboard)
		navigator.clipboard.writeText(saveField.value);
};
document.getElementById("loadbtn").onclick = function() {
	var v = saveField.value.trim();
	var m = v.match(/:[0-9a-f]+(?::[0-9a-f]{2}){5}:/);
	if (m) v = m[0];
	if (!v) return;
	sessionStorage.setItem("save", v);
	history.replaceState(null, "", location.pathname);
	location.reload();
};
</script>
<script src="prog.js"></script>
</body>
</html>
